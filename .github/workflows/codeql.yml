# CodeQL — GitHub SAST analysis for Python.
# Runs on every PR to main, every push to main, and on a weekly schedule.
# Free for public repos; included in GitHub Advanced Security for private repos.

name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan every Monday at 08:00 UTC to catch newly-disclosed CVEs.
    - cron: "0 8 * * 1"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    # Code scanning upload requires GitHub Advanced Security on private repos.
    # continue-on-error keeps this non-blocking until the repo is public or GHAS is enabled.
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use the default query suite for security + quality.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # SARIF upload requires GitHub Advanced Security (not available on free private repos).
          # Analysis still runs locally; re-enable upload when the repo goes public or GHAS is added.
          upload: never
