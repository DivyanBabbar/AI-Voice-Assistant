# dependabot.yml
#
# Weekly update checks for GitHub Actions (pins to commit SHAs and bumps
# them) and Python packages managed via pip/pyproject.toml.

version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"

  # ── Python (pip / pyproject.toml) ───────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
