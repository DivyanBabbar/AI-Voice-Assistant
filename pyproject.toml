[tool.poetry]
name = "voiceai"
version = "0.1.0"
description = "Hindi-first voice AI platform for rural India"
authors = ["Arnav Adarsh <missionbike2026@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "voiceai", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.28"
pydantic = "^2.7"
pydantic-settings = "^2.3"
structlog = "^24.1"
google-genai = "^2.0"
python-dotenv = "^1.0"
tenacity = "^9.1"
livekit = "^0.17"
livekit-api = "^0.8"
livekit-agents = ">=0.10,<1.0"
fastapi = "^0.115"
uvicorn = {version = ">=0.30,<0.52", extras = ["standard"]}

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4,<0.16"
black = "^26.5"
mypy = "^1.10"
pytest = "^9.1"
pytest-asyncio = "^1.3"
pytest-cov = "^7.1"
types-requests = "^2.32"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C90"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["voiceai"]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------------------
# black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/voiceai --cov-report=term-missing -q"
markers = [
    "integration: marks tests that make real external API calls (deselect with '-m not integration')",
]
